# Ejemplo: fallar una PR si la accesibilidad cae por debajo de un umbral.
#
# Copia este fichero a .github/workflows/ en el repositorio del sitio que
# quieras vigilar. Audita una URL desplegada y compara contra un umbral.
#
# Funciona porque la puntuación es determinista: con un score generado por un
# modelo, un umbral sería una moneda al aire entre ejecuciones.
name: UX audit

on:
  pull_request:
  # Útil también en programado, para detectar regresiones de terceros
  # (un CDN que cambia, un banner de cookies nuevo).
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run UX audit
        id: audit
        env:
          # La URL a auditar. En una PR real, la URL de preview del despliegue.
          TARGET_URL: https://example.com
          AUDITOR: https://ux-auditor-chi.vercel.app
        run: |
          set -euo pipefail

          response=$(curl -sS -X POST "$AUDITOR/api/audit" \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"$TARGET_URL\",\"language\":\"en\"}")

          # Un error de la API no debe pasar como "auditoría correcta".
          if echo "$response" | jq -e '.error' >/dev/null; then
            echo "::error::Audit failed: $(echo "$response" | jq -r '.error')"
            exit 1
          fi

          echo "$response" > audit.json
          {
            echo "overall=$(jq -r '.audit.overallScore' audit.json)"
            echo "accessibility=$(jq -r '.audit.scoreBreakdown.accessibility.score // 100' audit.json)"
            echo "rendered=$(jq -r '.audit.rendered' audit.json)"
            echo "confidence=$(jq -r '.audit.confidence' audit.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce thresholds
        env:
          MIN_ACCESSIBILITY: "80"
          MIN_OVERALL: "70"
        run: |
          set -euo pipefail
          a11y="${{ steps.audit.outputs.accessibility }}"
          overall="${{ steps.audit.outputs.overall }}"

          # Una auditoría de baja confianza sólo vio el esqueleto servido:
          # aprobar o suspender con ella sería decidir sobre datos malos.
          if [ "${{ steps.audit.outputs.confidence }}" = "low" ]; then
            echo "::warning::Low confidence — the page is likely client-rendered. Not gating on this result."
            exit 0
          fi

          echo "Accessibility $a11y (min $MIN_ACCESSIBILITY) · Overall $overall (min $MIN_OVERALL)"

          failed=0
          [ "$a11y" -lt "$MIN_ACCESSIBILITY" ] && { echo "::error::Accessibility $a11y below $MIN_ACCESSIBILITY"; failed=1; }
          [ "$overall" -lt "$MIN_OVERALL" ] && { echo "::error::Overall $overall below $MIN_OVERALL"; failed=1; }
          exit $failed

      - name: Summarise findings
        if: always()
        run: |
          [ -f audit.json ] || exit 0
          {
            echo "## UX audit"
            echo ""
            echo "**Score $(jq -r '.audit.overallScore' audit.json)/100** · $(jq -r '.audit.checksPassed' audit.json)/$(jq -r '.audit.checksApplicable' audit.json) checks passed"
            echo ""
            echo "| Severity | Finding |"
            echo "|---|---|"
            jq -r '.audit.findings[] | "| \(.severity) | \(.title) |"' audit.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-audit
          path: audit.json
