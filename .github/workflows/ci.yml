name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push rápido tras otro cancela el run anterior en lugar de encolarlo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Debe coincidir con "engines" en package.json.
          node-version: '20.9'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Sin navegador en el runner las 5 reglas visuales se omiten, que es
      # exactamente la degradación que la app debe soportar. Los tests visuales
      # usan snapshots sintéticos, así que no necesitan Chromium.
      - name: Build
        run: npm run build

      # Falla solo ante High/Critical: las moderadas de dependencias
      # transitivas no deben bloquear un merge.
      - name: Audit (high/critical)
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.9'
          cache: npm

      - name: Install
        run: npm ci

      # El runner no trae Chrome, y playwright-core no descarga navegadores.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Los E2E interceptan /api/audit, así que no necesitan clave de API ni red.
      # playwright.config.ts detecta CI y usa el Chromium instalado arriba en
      # lugar del canal "chrome", que no existe en el runner.
      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
