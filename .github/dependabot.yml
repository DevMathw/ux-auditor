version: 2
updates:
  # Agrupado y mensual: el objetivo es no quedarse atrás en parches de
  # seguridad, no generar una PR por cada patch de cada paquete.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Los majors llegan como PR individual: casi siempre necesitan revisión.
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [ci]
